name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        os:
          - ubuntu-latest
          - windows-latest
          - macos-15-intel
          - macos-26
          - macos-26-intel
          - xcode-27 # macOS 27, Apple Silicon; GitHub public preview image
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Report actual OS, architecture and Python version
        run: python -c "import platform, sys; print(platform.platform()); print(platform.machine()); print(sys.version)"
      - name: Install dependencies through the CarrierSIM launcher
        run: python -c "import launch, sys; sys.exit(0 if launch.install_dependencies(sys.executable, sys.version_info[:2]) else 1)"
      - name: Check installed dependencies and service imports
        run: |
          python -m pip check
          python tests/check_dependencies.py
      - name: Compile Python sources
        run: python -m compileall -q carrier.py launch.py carriersim_version.py tests .github/scripts
      - name: Run regression tests without a phone
        run: python -m unittest discover -s tests -v

  compatibility:
    name: Python compatibility
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every Python and OS combination to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success
